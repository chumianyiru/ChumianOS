name: chumian_launcher
description: ChumianOS Desktop Launcher
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  device_apps: ^2.2.0
  android_intent_plus: ^4.0.2
  shared_preferences: ^2.2.2
  provider: ^6.1.1
  flutter_staggered_grid_view: ^0.7.0
  google_fonts: ^6.1.0
  intl: ^0.19.0
  path_provider: ^2.1.1
  permission_handler: ^11.1.0
  app_settings: ^5.1.1
  url_launcher: ^6.2.2
  image_picker: ^1.0.7
  flutter_svg: ^2.0.9
  animations: ^2.0.11
  dynamic_color: ^1.6.9
  material_color_utilities: ^0.8.0
  battery_plus: ^5.0.2
  connectivity_plus: ^5.0.2
  sensors_plus: ^4.0.2
  flutter_vibrate: ^1.3.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  uuid: ^4.2.2
  flutter_animate: ^4.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  hive_generator: ^2.0.1
  build_runner: ^2.4.7

flutter:
  uses-material-design: true
  assets:
    - assets/wallpapers/
    - assets/icons/
    - assets/themes/
    - assets/fonts/

  fonts:
    - family: ChumianSans
      fonts:
        - asset: assets/fonts/ChumianSans-Regular.ttf
        - asset: assets/fonts/ChumianSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/ChumianSans-Light.ttf
          weight: 300
