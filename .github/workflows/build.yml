name: Build ChumianOS APKs

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-launcher:
    name: Build ChumianOS Launcher
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          channel: 'stable'

      - name: Install dependencies
        run: |
          cd chumian_launcher
          flutter pub get

      - name: Build APK
        run: |
          cd chumian_launcher
          flutter build apk --release --no-tree-shake-icons

      - name: Upload Launcher APK
        uses: actions/upload-artifact@v4
        with:
          name: chumian-launcher-apk
          path: chumian_launcher/build/app/outputs/flutter-apk/app-release.apk

  build-welcome:
    name: Build ChumianOS Welcome
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          channel: 'stable'

      - name: Install dependencies
        run: |
          cd chumian_welcome
          flutter pub get

      - name: Build APK
        run: |
          cd chumian_welcome
          flutter build apk --release --no-tree-shake-icons

      - name: Upload Welcome APK
        uses: actions/upload-artifact@v4
        with:
          name: chumian-welcome-apk
          path: chumian_welcome/build/app/outputs/flutter-apk/app-release.apk
