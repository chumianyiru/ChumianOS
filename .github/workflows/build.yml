name: Build ChumianOS APKs

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-launcher:
    name: Build ChumianOS Launcher
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.13.0'
          channel: 'stable'

      - name: Install dependencies
        run: |
          cd launcher
          flutter pub get

      - name: Build APK
        run: |
          cd launcher
          flutter build apk --release --no-tree-shake-icons

      - name: Upload Launcher APK
        uses: actions/upload-artifact@v4
        with:
          name: chumian-launcher-apk
          path: launcher/build/app/outputs/flutter-apk/app-release.apk

  build-settings:
    name: Build ChumianOS Settings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.13.0'
          channel: 'stable'

      - name: Install dependencies
        run: |
          cd settings
          flutter pub get

      - name: Build APK
        run: |
          cd settings
          flutter build apk --release --no-tree-shake-icons

      - name: Upload Settings APK
        uses: actions/upload-artifact@v4
        with:
          name: chumian-settings-apk
          path: settings/build/app/outputs/flutter-apk/app-release.apk

  build-setup-wizard:
    name: Build ChumianOS Setup Wizard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.13.0'
          channel: 'stable'

      - name: Install dependencies
        run: |
          cd setup-wizard
          flutter pub get

      - name: Build APK
        run: |
          cd setup-wizard
          flutter build apk --release --no-tree-shake-icons

      - name: Upload Setup Wizard APK
        uses: actions/upload-artifact@v4
        with:
          name: chumian-setup-wizard-apk
          path: setup-wizard/build/app/outputs/flutter-apk/app-release.apk
