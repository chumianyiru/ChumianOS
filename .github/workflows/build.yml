name: ChumianOS Build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-launcher:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'
      
      - name: Build Launcher APK
        working-directory: ./launcher
        run: |
          flutter pub get
          flutter build apk --release --target-platform android-arm64
          mv build/app/outputs/flutter-apk/app-release.apk ../chumian-launcher.apk
      
      - name: Build Setup Wizard APK
        working-directory: ./setup-wizard
        run: |
          flutter pub get
          flutter build apk --release --target-platform android-arm64
          mv build/app/outputs/flutter-apk/app-release.apk ../chumian-setup.apk
      
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: chumianos-apks
          path: |
            chumian-launcher.apk
            chumian-setup.apk
      
      - name: Create Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v1.0.0-${{ github.run_number }}
          name: ChumianOS Build ${{ github.run_number }}
          files: |
            chumian-launcher.apk
            chumian-setup.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
